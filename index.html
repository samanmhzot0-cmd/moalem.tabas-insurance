<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه خدمات بیمه</title>
<style>
body{font-family:Tahoma,Arial;margin:0;background:#f4f7fb;color:#172033}header{background:#07549a;color:#fff;padding:18px}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:16px;margin:15px 0;box-shadow:0 8px 30px #0000000d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,button,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccd7e4}button{background:#07549a;color:#fff;cursor:pointer;border:0}button.secondary{background:#eaf3fc;color:#07549a}.full{grid-column:1/-1}.hidden{display:none}.msg{padding:10px;background:#eef7ff;border-radius:9px}img{max-width:180px;margin:8px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header><div class="wrap"><h1>سامانه خدمات بیمه</h1><p>نمونه Full Stack</p></div></header>
<div class="wrap">
<div id="auth" class="card">
<h2 id="authTitle">ورود</h2>
<div class="grid">
<input id="name" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره موبایل">
<input id="password" type="password" placeholder="رمز عبور">
<button onclick="submitAuth()">ورود</button>
<button class="secondary" onclick="toggleAuth()">ثبت‌نام</button>
</div><p id="authMsg"></p>
</div>

<div id="app" class="hidden">
<div class="card"><h2>حساب من</h2>
<div class="grid">
<input id="pname" placeholder="نام">
<input id="national" placeholder="کد ملی">
<input id="email" placeholder="ایمیل">
<input id="address" placeholder="آدرس">
<input id="birth" type="date">
<button onclick="saveProfile()">ذخیره اطلاعات</button>
<button class="secondary" onclick="logout()">خروج</button>
</div></div>

<div class="card"><h2>درخواست بیمه</h2>
<div class="grid">
<select id="type"><option>شخص ثالث</option><option>بدنه</option><option>آتش‌سوزی</option><option>درمان</option><option>مسافرتی</option><option>مسئولیت</option></select>
<textarea id="note" placeholder="توضیحات"></textarea>
<button class="full" onclick="requestInsurance()">ثبت درخواست</button>
</div></div>

<div class="card"><h2>عکس‌های بیمه بدنه</h2>
<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<button onclick="uploadPhotos()">آپلود عکس‌ها</button>
<div id="photoList"></div></div>

<div class="card"><h2>درخواست‌های من</h2><div id="requests"></div></div>
</div>
</div>

<script>
let token=localStorage.getItem("token"),register=false;
const api=(url,opt={})=>fetch(url,{...opt,headers:{...(opt.headers||{}),...(token?{Authorization:"Bearer "+token}:{})}});
function toggleAuth(){register=!register;document.getElementById("authTitle").textContent=register?"ثبت‌نام":"ورود";document.querySelector("#auth button").textContent=register?"ثبت‌نام":"ورود";document.getElementById("name").style.display=register?"block":"none"}
async function submitAuth(){
 const body={phone:phone.value,password:password.value};if(register)body.name=name.value;
 const r=await api(register?"/api/register":"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
 const d=await r.json();if(!r.ok){authMsg.textContent=d.error;return}token=d.token;localStorage.setItem("token",token);await load();
}
async function load(){
 auth.classList.add("hidden");app.classList.remove("hidden");
 const u=await (await api("/api/me")).json();pname.value=u.profile.name||"";national.value=u.profile.national||"";email.value=u.profile.email||"";address.value=u.profile.address||"";birth.value=u.profile.birth||"";loadRequests();
}
async function saveProfile(){
 await api("/api/me",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:pname.value,national:national.value,email:email.value,address:address.value,birth:birth.value})});alert("ذخیره شد");
}
async function requestInsurance(){
 const r=await api("/api/requests",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({type:type.value,note:note.value})});if(r.ok){note.value="";loadRequests();alert("درخواست ثبت شد")}
}
async function loadRequests(){
 const r=await (await api("/api/requests")).json();requests.innerHTML=r.length?r.map(x=>`<div class="msg">${x.type} — ${x.status} — ${new Date(x.createdAt).toLocaleDateString("fa-IR")}</div>`).join(""):"درخواستی ثبت نشده";
}
async function uploadPhotos(){
 const fd=new FormData();[...photos.files].forEach(f=>fd.append("photos",f));const r=await api("/api/body-photos",{method:"POST",body:fd});const d=await r.json();if(!r.ok){alert(d.error);return}photoList.innerHTML=d.map(x=>`<img src="${x.path}">`).join("");alert("عکس‌ها ثبت شدند");
}
function logout(){localStorage.removeItem("token");location.reload()}
if(token)load();else{name.style.display="none"}
</script>
</body>
</html>
